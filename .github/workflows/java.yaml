name: Java CI (Build & Test)

on:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]

    workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.x.x https://github.com/actions/checkout/releases

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 #v4.x.x https://github.com/actions/setup-java/releases
        with:
            java-version: '21'
            distribution: temurin

      - name: Cache Maven Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4.x.x https://github.com/actions/cache/releases
        with:
          path: ~/.m2/repository # Maven lokale mappe, som caches
          # Unik cache-nøgle, runneren kører Linux-styresystem, hashfiles læser pom.xml og laver hash
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Build & test with Maven
        run: mvn verify

